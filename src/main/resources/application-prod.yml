# Profil de production (Render). Toutes les valeurs sensibles viennent des variables d'environnement.
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  s3:
    endpoint: ${APP_S3_ENDPOINT}
    region: ${APP_S3_REGION:eu-west-2}
    bucket: ${APP_S3_BUCKET:scanned-docs}
    access-key: ${APP_S3_ACCESS_KEY}
    secret-key: ${APP_S3_SECRET_KEY}
    path-style-access: true
