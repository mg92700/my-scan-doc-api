# =====================================================================
# Profil "prod" (SPRING_PROFILES_ACTIVE=prod, activé par le Dockerfile et render.yaml).
# Il s'ajoute à application.yml : seules les différences propres à la production sont ici.
# Les valeurs sensibles (base, S3, JWT, compte de service) restent lues depuis
# l'environnement dans application.yml. Voir README.md et SECURITY.md.
# =====================================================================
spring:
  main:
    banner-mode: "off"
  datasource:
    hikari:
      # Peu de connexions : le pooler Supabase (plan gratuit) limite le nombre de clients
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    # Jamais de requêtes SQL dans les logs (elles peuvent contenir des données)
    show-sql: false

server:
  # Arrêt propre : les requêtes en cours (uploads) se terminent avant l'arrêt du conteneur
  shutdown: graceful

logging:
  level:
    root: INFO
    # Pas de détails d'authentification dans les logs
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
