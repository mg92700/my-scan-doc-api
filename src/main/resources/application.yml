# Toutes les valeurs sont lues depuis le fichier .env à la racine du projet
# (ou depuis les variables d'environnement, qui sont prioritaires).
# Le fichier .env est optionnel : sans lui, seules les variables d'environnement sont utilisées.
spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: my-scan-doc-api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${PORT:8081}

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-minutes: 120
  s3:
    endpoint: ${APP_S3_ENDPOINT}
    region: ${APP_S3_REGION:eu-west-2}
    bucket: ${APP_S3_BUCKET}
    access-key: ${APP_S3_ACCESS_KEY}
    secret-key: ${APP_S3_SECRET_KEY}
    path-style-access: true
