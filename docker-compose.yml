services:
  # Les images minio/minio et minio/mc ne sont plus publiées sur Docker Hub :
  # on utilise les images Chainguard (même binaire MinIO, format de données identique).
  minio:
    image: cgr.dev/chainguard/minio:latest
    # l'ancienne image tournait en root : on garde ce comportement pour lire ./minio-data existant
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    healthcheck:
      # pas de curl dans l'image : requête HTTP via bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ $$line == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    # pas de shell dans l'image : alias via variable d'env, une seule commande mc
    # (un bucket MinIO est privé par défaut)
    environment:
      MC_HOST_local: http://minio:minio12345@minio:9000
    command: ["mb", "--ignore-existing", "local/scanned-docs"]
    restart: "no"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: myscandoc
      POSTGRES_USER: scan
      POSTGRES_PASSWORD: scanpwd
    ports:
      - "5432:5432"
    volumes:
      - ./pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scan -d myscandoc"]
      interval: 10s
      timeout: 5s
      retries: 5

