# Toutes les valeurs sensibles / dépendantes de l'environnement sont surchargeables
# par variables d'environnement. Les valeurs par défaut correspondent au docker-compose local.
spring:
  application:
    name: my-scan-doc-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/myscandoc}
    username: ${DB_USERNAME:scan}
    password: ${DB_PASSWORD:scanpwd}
    hikari:
      connection-timeout: 5000    # ms — échec rapide si la base est injoignable
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate.jdbc.time_zone: UTC

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB      # marge pour l'enveloppe multipart

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful              # termine les uploads en cours avant l'arrêt
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness et /readiness

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-very-long-random-secret-64chars-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:eu-west-3}
    bucket: ${S3_BUCKET:scanned-docs}
    access-key: ${S3_ACCESS_KEY:minio}
    secret-key: ${S3_SECRET_KEY:minio12345}
    path-style-access: true
    api-call-timeout: 30s
    api-call-attempt-timeout: 10s
